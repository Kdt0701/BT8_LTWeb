<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BT8 - GraphQL AJAX Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body class="container py-4">

    <h2 class="mb-4 text-primary">Quản lý Sản Phẩm & Danh Mục bằng GraphQL + AJAX</h2>

    <!-- Actions Bar -->
    <div class="mb-3 d-flex gap-2">
        <button id="btnLoadPriceAsc" class="btn btn-success">Sản phẩm Giá (Thấp -> Cao)</button>
        <button id="btnLoadAllCategories" class="btn btn-primary">Tải danh sách Category</button>
        <div class="input-group" style="max-width: 300px;">
            <input type="number" id="catIdInput" class="form-control" placeholder="Nhập Category ID">
            <button id="btnFilterByCat" class="btn btn-warning">Lọc SP theo Category</button>
        </div>
    </div>

    <!-- Product Table -->
    <div class="card my-3">
        <div class="card-header fw-bold">Danh sách Sản Phẩm (Product)</div>
        <div class="card-body">
            <table class="table table-bordered table-striped" id="productTable">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Tên sản phẩm</th>
                        <th>Số lượng</th>
                        <th>Giá (VND)</th>
                        <th>Mô tả</th>
                        <th>Category</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="6" class="text-center">Chưa có dữ liệu</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Category Table -->
    <div class="card my-3">
        <div class="card-header fw-bold">Danh sách Danh Mục (Category)</div>
        <div class="card-body">
            <table class="table table-bordered table-striped" id="categoryTable">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Tên danh mục</th>
                        <th>Hình ảnh</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="3" class="text-center">Chưa có dữ liệu</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const GRAPHQL_URL = '/graphql';

        // Hàm chung gửi GraphQL AJAX Request
        function executeGraphQL(query, variables = {}) {
            return $.ajax({
                url: GRAPHQL_URL,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ query: query, variables: variables })
            });
        }

        // 1. Hiển thị tất cả sản phẩm sắp xếp giá từ thấp đến cao
        $('#btnLoadPriceAsc').click(function () {
            const query = `
                query {
                    allProductsByPriceAsc {
                        id
                        title
                        quantity
                        price
                        desc
                        category { name }
                    }
                }
            `;
            executeGraphQL(query).done(function (res) {
                const products = res.data.allProductsByPriceAsc;
                let rows = '';
                products.forEach(p => {
                    rows += `<tr>
                        <td>${p.id}</td>
                        <td>${p.title}</td>
                        <td>${p.quantity}</td>
                        <td>${p.price}</td>
                        <td>${p.desc || ''}</td>
                        <td>${p.category ? p.category.name : 'N/A'}</td>
                    </tr>`;
                });
                $('#productTable tbody').html(rows || '<tr><td colspan="6" class="text-center">Không có dữ liệu</td></tr>');
            });
        });

        // 2. Lấy tất cả sản phẩm thuộc 1 Category ID
        $('#btnFilterByCat').click(function () {
            const catId = $('#catIdInput').val();
            if (!catId) {
                alert('Vui lòng nhập Category ID');
                return;
            }
            const query = `
                query GetProductsByCat($catId: ID!) {
                    productsByCategory(categoryId: $catId) {
                        id
                        title
                        quantity
                        price
                        desc
                        category { name }
                    }
                }
            `;
            executeGraphQL(query, { catId: catId }).done(function (res) {
                const products = res.data.productsByCategory;
                let rows = '';
                products.forEach(p => {
                    rows += `<tr>
                        <td>${p.id}</td>
                        <td>${p.title}</td>
                        <td>${p.quantity}</td>
                        <td>${p.price}</td>
                        <td>${p.desc || ''}</td>
                        <td>${p.category ? p.category.name : 'N/A'}</td>
                    </tr>`;
                });
                $('#productTable tbody').html(rows || '<tr><td colspan="6" class="text-center">Không tìm thấy sản phẩm</td></tr>');
            });
        });

        // 3. Tải danh sách Categories
        $('#btnLoadAllCategories').click(function () {
            const query = `
                query {
                    allCategories {
                        id
                        name
                        images
                    }
                }
            `;
            executeGraphQL(query).done(function (res) {
                const categories = res.data.allCategories;
                let rows = '';
                categories.forEach(c => {
                    rows += `<tr>
                        <td>${c.id}</td>
                        <td>${c.name}</td>
                        <td>${c.images || ''}</td>
                    </tr>`;
                });
                $('#categoryTable tbody').html(rows || '<tr><td colspan="3" class="text-center">Không có dữ liệu</td></tr>');
            });
        });
    </script>
</body>
</html>
