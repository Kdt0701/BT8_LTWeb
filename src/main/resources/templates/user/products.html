<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cửa Hàng - Xem Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body class="container py-4">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 px-3 rounded">
        <a class="navbar-brand fw-bold" href="/user/products">🛍️ WebShop (User)</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-warning fw-bold" href="/admin/products">⚙️ Trang Admin</a>
        </div>
    </nav>

    <h3 class="mb-4 text-primary fw-bold">Danh Sách Sản Phẩm</h3>

    <!-- Thanh lọc & sắp xếp -->
    <div class="row g-3 mb-4 align-items-center">
        <div class="col-md-4">
            <!-- Nút bật/tắt sắp xếp Thấp <-> Cao -->
            <button id="btnSortPrice" class="btn btn-outline-success w-100 fw-bold">
                Sắp xếp: Giá Thấp ➔ Cao ⬆️
            </button>
        </div>
        <div class="col-md-5">
            <div class="input-group">
                <select id="selectCategoryFilter" class="form-select">
                    <option value="">-- Tất cả danh mục --</option>
                </select>
                <button id="btnFilterCat" class="btn btn-warning">Lọc</button>
            </div>
        </div>
    </div>

    <!-- Bảng danh sách sản phẩm -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0" id="productTable">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th style="width: 80px;">Hình ảnh</th>
                        <th>Tên sản phẩm</th>
                        <th>Số lượng</th>
                        <th>Giá (VND)</th>
                        <th>Mô tả</th>
                        <th>Danh mục</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="7" class="text-center py-3">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const GRAPHQL_URL = '/graphql';
        let currentProducts = []; // Lưu danh sách sản phẩm hiện tại
        let isAscending = true;   // Mặc định: Thấp -> Cao

        function executeGraphQL(query, variables = {}) {
            return $.ajax({
                url: GRAPHQL_URL,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ query, variables })
            });
        }

        // Hàm lấy ảnh sản phẩm thực tế theo tên hoặc danh mục
        function getProductImageUrl(p) {
            const title = (p.title || '').toLowerCase();
            const catName = (p.category ? p.category.name : '').toLowerCase();

            if (title.includes('iphone') || title.includes('samsung') || title.includes('xiaomi') || catName.includes('điện thoại')) {
                return `https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=150&auto=format&fit=crop&q=80`;
            }
            if (title.includes('macbook') || title.includes('laptop') || title.includes('dell') || catName.includes('laptop')) {
                return `https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=150&auto=format&fit=crop&q=80`;
            }
            if (title.includes('ipad') || title.includes('tab') || catName.includes('máy tính bảng')) {
                return `https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=150&auto=format&fit=crop&q=80`;
            }
            if (title.includes('watch') || title.includes('garmin') || catName.includes('đồng hồ')) {
                return `https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=150&auto=format&fit=crop&q=80`;
            }
            if (title.includes('airpods') || title.includes('loa') || title.includes('tai nghe') || catName.includes('âm thanh')) {
                return `https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=150&auto=format&fit=crop&q=80`;
            }
            return `https://images.unsplash.com/photo-1526738549149-8e07eca6c147?w=150&auto=format&fit=crop&q=80`;
        }

        function renderProducts(products) {
            currentProducts = products || [];

            // Ép buộc sắp xếp chính xác theo chiều mong muốn bằng JavaScript
            currentProducts.sort((a, b) => {
                return isAscending ? (a.price - b.price) : (b.price - a.price);
            });

            let rows = '';
            if (currentProducts.length > 0) {
                currentProducts.forEach(p => {
                    const imgUrl = getProductImageUrl(p);

                    rows += `<tr>
                        <td>${p.id}</td>
                        <td>
                            <img src="${imgUrl}" 
                                 alt="${p.title}" 
                                 class="rounded border shadow-sm" 
                                 width="50" height="50" 
                                 style="object-fit: cover;">
                        </td>
                        <td class="fw-bold">${p.title}</td>
                        <td>${p.quantity}</td>
                        <td class="text-danger fw-bold">${p.price.toLocaleString('vi-VN')} đ</td>
                        <td>${p.desc || ''}</td>
                        <td><span class="badge bg-info text-dark">${p.category ? p.category.name : 'N/A'}</span></td>
                    </tr>`;
                });
            } else {
                rows = '<tr><td colspan="7" class="text-center py-3">Không tìm thấy sản phẩm</td></tr>';
            }
            $('#productTable tbody').html(rows);
        }

        function loadProducts() {
            const query = `
                query {
                    allProductsByPriceAsc {
                        id title quantity price desc category { name }
                    }
                }
            `;
            executeGraphQL(query).done(res => {
                const list = res.data ? res.data.allProductsByPriceAsc : [];
                renderProducts(list);
            });
        }

        function loadCategoriesDropdown() {
            const query = `query { allCategories { id name } }`;
            executeGraphQL(query).done(res => {
                const categories = res.data ? res.data.allCategories : [];
                let options = '<option value="">-- Tất cả danh mục --</option>';
                categories.forEach(c => {
                    options += `<option value="${c.id}">${c.name}</option>`;
                });
                $('#selectCategoryFilter').html(options);
            });
        }

        // Đổi chiều sắp xếp khi bấm nút
        $('#btnSortPrice').click(function () {
            isAscending = !isAscending;
            if (isAscending) {
                $(this).text('Sắp xếp: Giá Thấp ➔ Cao ⬆️')
                       .removeClass('btn-outline-danger')
                       .addClass('btn-outline-success');
            } else {
                $(this).text('Sắp xếp: Giá Cao ➔ Thấp ⬇️')
                       .removeClass('btn-outline-success')
                       .addClass('btn-outline-danger');
            }
            renderProducts(currentProducts);
        });

        $('#btnFilterCat').click(function () {
            const catId = $('#selectCategoryFilter').val();
            if (!catId) {
                loadProducts();
                return;
            }
            const query = `
                query GetProductsByCat($catId: ID!) {
                    productsByCategory(categoryId: $catId) {
                        id title quantity price desc category { name }
                    }
                }
            `;
            executeGraphQL(query, { catId }).done(res => {
                const list = res.data ? res.data.productsByCategory : [];
                renderProducts(list);
            });
        });

        $(document).ready(function () {
            loadProducts();
            loadCategoriesDropdown();
        });
    </script>
</body>
</html>
