<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cửa Hàng - Xem Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body class="container py-4">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 px-3 rounded">
        <a class="navbar-brand fw-bold" href="/user/products">🛍️ WebShop (User)</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-warning fw-bold" href="/admin/products">⚙️ Trang Admin</a>
        </div>
    </nav>

    <h3 class="mb-4 text-primary">Danh Sách Sản Phẩm</h3>

    <!-- Thanh lọc & sắp xếp -->
    <div class="row g-3 mb-4 align-items-center">
        <div class="col-md-3">
            <button id="btnLoadPriceAsc" class="btn btn-outline-success w-100">Sắp xếp: Giá Thấp ➔ Cao</button>
        </div>
        <div class="col-md-5">
            <div class="input-group">
                <select id="selectCategoryFilter" class="form-select">
                    <option value="">-- Tất cả danh mục --</option>
                </select>
                <button id="btnFilterCat" class="btn btn-warning">Lọc</button>
            </div>
        </div>
    </div>

    <!-- Bảng danh sách sản phẩm -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0" id="productTable">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Tên sản phẩm</th>
                        <th>Số lượng</th>
                        <th>Giá (VND)</th>
                        <th>Mô tả</th>
                        <th>Danh mục</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="6" class="text-center py-3">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const GRAPHQL_URL = '/graphql';

        function executeGraphQL(query, variables = {}) {
            return $.ajax({
                url: GRAPHQL_URL,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ query, variables })
            });
        }

        function renderProducts(products) {
            let rows = '';
            if (products && products.length > 0) {
                products.forEach(p => {
                    rows += `<tr>
                        <td>${p.id}</td>
                        <td class="fw-bold">${p.title}</td>
                        <td>${p.quantity}</td>
                        <td class="text-danger fw-bold">${p.price.toLocaleString('vi-VN')} đ</td>
                        <td>${p.desc || ''}</td>
                        <td><span class="badge bg-info text-dark">${p.category ? p.category.name : 'N/A'}</span></td>
                    </tr>`;
                });
            } else {
                rows = '<tr><td colspan="6" class="text-center py-3">Không tìm thấy sản phẩm</td></tr>';
            }
            $('#productTable tbody').html(rows);
        }

        function loadProducts() {
            const query = `
                query {
                    allProductsByPriceAsc {
                        id title quantity price desc category { name }
                    }
                }
            `;
            executeGraphQL(query).done(res => renderProducts(res.data ? res.data.allProductsByPriceAsc : []));
        }

        function loadCategoriesDropdown() {
            const query = `query { allCategories { id name } }`;
            executeGraphQL(query).done(res => {
                const categories = res.data ? res.data.allCategories : [];
                let options = '<option value="">-- Tất cả danh mục --</option>';
                categories.forEach(c => {
                    options += `<option value="${c.id}">${c.name}</option>`;
                });
                $('#selectCategoryFilter').html(options);
            });
        }

        $('#btnLoadPriceAsc').click(loadProducts);

        $('#btnFilterCat').click(function () {
            const catId = $('#selectCategoryFilter').val();
            if (!catId) {
                loadProducts();
                return;
            }
            const query = `
                query GetProductsByCat($catId: ID!) {
                    productsByCategory(categoryId: $catId) {
                        id title quantity price desc category { name }
                    }
                }
            `;
            executeGraphQL(query, { catId }).done(res => renderProducts(res.data ? res.data.productsByCategory : []));
        });

        $(document).ready(function () {
            loadProducts();
            loadCategoriesDropdown();
        });
    </script>
</body>
</html>
