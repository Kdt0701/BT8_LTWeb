<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Quản lý Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body class="container py-4">

    <!-- Navbar Admin -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger mb-4 px-3 rounded">
        <a class="navbar-brand fw-bold" href="#">⚙️ Admin Dashboard</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/admin/categories">Quản lý Danh Mục</a>
            <a class="nav-link active" href="/admin/products">Quản lý Sản Phẩm</a>
        </div>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white border border-white rounded px-2" href="/user/products">👁️ Xem trang User</a>
        </div>
    </nav>

    <!-- Form thêm Sản phẩm -->
    <div class="card shadow-sm border-success mb-4">
        <div class="card-header bg-success text-white fw-bold">Thêm Sản Phẩm Mới</div>
        <div class="card-body">
            <div class="row g-3 mb-2">
                <div class="col-md-4">
                    <label class="form-label">Tên sản phẩm</label>
                    <input type="text" id="prodTitle" class="form-control" placeholder="VD: MacBook Air M2">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Giá (VND)</label>
                    <input type="number" id="prodPrice" class="form-control" placeholder="25000000">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Số lượng</label>
                    <input type="number" id="prodQty" class="form-control" value="10">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Danh mục (Category)</label>
                    <select id="prodCatSelect" class="form-select">
                        <option value="">-- Chọn danh mục --</option>
                    </select>
                </div>
            </div>
            <div class="row g-3">
                <div class="col-md-10">
                    <label class="form-label">Mô tả</label>
                    <input type="text" id="prodDesc" class="form-control" placeholder="VD: Màn hình Retina, RAM 8GB">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button id="btnAddProduct" class="btn btn-success w-100 fw-bold">Lưu Sản Phẩm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bảng sản phẩm -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white fw-bold">Danh Sách Sản Phẩm Trong Hệ Thống</div>
        <div class="card-body p-0">
            <table class="table table-striped align-middle mb-0" id="productTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th style="width: 70px;">Hình ảnh</th>
                        <th>Tên sản phẩm</th>
                        <th>Số lượng</th>
                        <th>Giá (VND)</th>
                        <th>Mô tả</th>
                        <th>Danh mục</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="7" class="text-center py-3">Đang tải...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const GRAPHQL_URL = '/graphql';

        function executeGraphQL(query, variables = {}) {
            return $.ajax({
                url: GRAPHQL_URL,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ query, variables })
            });
        }

        // Hàm lấy ảnh sản phẩm thực tế theo tên hoặc danh mục
        function getProductImageUrl(p) {
            const title = (p.title || '').toLowerCase();
            const catName = (p.category ? p.category.name : '').toLowerCase();

            if (title.includes('iphone') || title.includes('samsung') || title.includes('xiaomi') || catName.includes('điện thoại')) {
                return `https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=150&auto=format&fit=crop&q=80`;
            }
            if (title.includes('macbook') || title.includes('laptop') || title.includes('dell') || catName.includes('laptop')) {
                return `https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=150&auto=format&fit=crop&q=80`;
            }
            if (title.includes('ipad') || title.includes('tab') || catName.includes('máy tính bảng')) {
                return `https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=150&auto=format&fit=crop&q=80`;
            }
            if (title.includes('watch') || title.includes('garmin') || catName.includes('đồng hồ')) {
                return `https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=150&auto=format&fit=crop&q=80`;
            }
            if (title.includes('airpods') || title.includes('loa') || title.includes('tai nghe') || catName.includes('âm thanh')) {
                return `https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=150&auto=format&fit=crop&q=80`;
            }
            return `https://images.unsplash.com/photo-1526738549149-8e07eca6c147?w=150&auto=format&fit=crop&q=80`;
        }

        function loadProducts() {
            const query = `
                query {
                    allProductsByPriceAsc {
                        id title quantity price desc category { name }
                    }
                }
            `;
            executeGraphQL(query).done(res => {
                let products = res.data ? res.data.allProductsByPriceAsc : [];
                
                // Ép buộc sắp xếp Tăng dần (Thấp -> Cao) theo giá bằng Javascript
                products.sort((a, b) => (a.price || 0) - (b.price || 0));

                let rows = '';
                products.forEach(p => {
                    const imgUrl = getProductImageUrl(p);

                    rows += `<tr>
                        <td>${p.id}</td>
                        <td>
                            <img src="${imgUrl}" 
                                 alt="${p.title}" 
                                 class="rounded border shadow-sm" 
                                 width="45" height="45" 
                                 style="object-fit: cover;">
                        </td>
                        <td class="fw-bold">${p.title}</td>
                        <td>${p.quantity}</td>
                        <td class="text-danger fw-bold">${p.price.toLocaleString('vi-VN')} đ</td>
                        <td>${p.desc || ''}</td>
                        <td><span class="badge bg-secondary">${p.category ? p.category.name : 'N/A'}</span></td>
                    </tr>`;
                });
                $('#productTable tbody').html(rows || '<tr><td colspan="7" class="text-center">Chưa có sản phẩm</td></tr>');
            });
        }

        function loadCategoriesDropdown() {
            const query = `query { allCategories { id name } }`;
            executeGraphQL(query).done(res => {
                const categories = res.data ? res.data.allCategories : [];
                let options = '<option value="">-- Chọn danh mục --</option>';
                categories.forEach(c => {
                    options += `<option value="${c.id}">${c.name} (ID: ${c.id})</option>`;
                });
                $('#prodCatSelect').html(options);
            });
        }

        $('#btnAddProduct').click(function () {
            const title = $('#prodTitle').val().trim();
            const price = parseFloat($('#prodPrice').val()) || 0;
            const quantity = parseInt($('#prodQty').val()) || 0;
            const desc = $('#prodDesc').val().trim();
            const categoryId = $('#prodCatSelect').val();

            if (!title) { alert('Vui lòng nhập tên sản phẩm!'); return; }
            if (!categoryId) { alert('Vui lòng chọn Category!'); return; }

            const mutation = `
                mutation CreateProduct($title: String!, $quantity: Int, $price: Float, $desc: String, $categoryId: ID, $userId: ID) {
                    createProduct(title: $title, quantity: $quantity, price: $price, desc: $desc, categoryId: $categoryId, userId: $userId) {
                        id title price
                    }
                }
            `;

            executeGraphQL(mutation, { title, quantity, price, desc, categoryId, userId: 1 }).done(res => {
                if (res.data && res.data.createProduct) {
                    alert('Thêm sản phẩm thành công!');
                    $('#prodTitle').val('');
                    $('#prodPrice').val('');
                    $('#prodDesc').val('');
                    loadProducts();
                } else {
                    alert('Lỗi: ' + JSON.stringify(res.errors));
                }
            });
        });

        $(document).ready(function () {
            loadProducts();
            loadCategoriesDropdown();
        });
    </script>
</body>
</html>
